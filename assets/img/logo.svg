<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" width="220" height="40" role="img" aria-label="Microsoft Build × CCU 2026">
  <!-- Microsoft 4-square mark -->
  <g>
    <rect x="0"  y="2"  width="16" height="16" fill="#F25022"/>
    <rect x="18" y="2"  width="16" height="16" fill="#7FBA00"/>
    <rect x="0"  y="20" width="16" height="16" fill="#00A4EF"/>
    <rect x="18" y="20" width="16" height="16" fill="#FFB900"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" fill="#ffffff">
    <text x="44" y="24" font-size="18" font-weight="700" letter-spacing="-0.3">Build</text>
    <text x="92" y="24" font-size="18" font-weight="300" fill="#94a3b8">×</text>
    <text x="106" y="24" font-size="18" font-weight="700">CCU</text>
    <text x="152" y="24" font-size="18" font-weight="400" fill="#94a3b8">2026</text>
  </g>
